name: Release

# Pushing a tag such as v0.2.0 builds the plugin with that version and publishes a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Test
        run: dotnet test QuickLook.Plugin.DuckDbViewer.sln -c Release --nologo

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/pack.ps1 -Version $version
          ./scripts/pack.ps1 -Version $version -Lite

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' (Get-ChildItem artifacts/*.qlplugin, artifacts/*.zip) --generate-notes
